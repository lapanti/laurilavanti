    - text: Q & A
    - heading "Frequently asked questions" [level=2]
    - heading "Where is Lauri Lavanti running for parliament?" [level=3]
    - paragraph: /Lauri Lavanti is the Greens' parliamentary candidate in the Uusimaa electoral district in the \d+ parliamentary elections\. He is a municipal councillor in Kirkkonummi and a lead developer, working towards a digitally independent Finland where the economy, education, and rights work together in the age of AI\./
    - heading "What values does Lauri Lavanti's politics rest on?" [level=3]
    - paragraph: The values most important to Lauri Lavanti are justice, equality, and democracy, together with openness and honesty. In his thinking, the economy is a means to fund schools, care, and other shared services, and everyone's privacy and fundamental rights must be safeguarded in the age of AI as well. The goal is a digitally independent Finland where no one is left behind.
    - heading "What does AI mean for the Finnish economy?" [level=3]
    - paragraph: AI is transforming the foundations of work, competitiveness, and public services — Finland needs to build its own expertise rather than becoming dependent on foreign platforms. Lauri Lavanti argues that economic policy must respond to this shift with concrete technological knowledge, not just general statements.
    - heading "Why is privacy protection a political issue?" [level=3]
    - paragraph: "Privacy is a fundamental right that risks becoming stratified: those with the resources and knowledge protect themselves, while others cannot. Lauri Lavanti treats digital privacy as an equality issue that requires both legislation and genuine technical understanding."
    - heading "What does digital independence mean in practice?" [level=3]
    - paragraph: Digital independence means that public services, critical infrastructure, and citizens' data are not at the mercy of a handful of foreign corporations. Lauri Lavanti advocates for policies where Finland and the EU build their own technology base, rather than purchasing surveillance capacity from abroad.
    - heading "How does technical expertise show up in political decision-making?" [level=3]
    - paragraph: Lauri Lavanti brings hands-on experience in software development and digital systems to decision-making — he can tell when a technical argument holds and when it's just a sales pitch. His goal is for the public sector to keep pace with technological development and not procure solutions it doesn't understand.
