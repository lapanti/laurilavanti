- main:
  - heading "Lauri Lavanti" [level=1]
  - heading "Because technology should serve Finland" [level=2]
  - paragraph: Running for Parliament in Uusimaa
  - img "Lauri Lavanti resting his hands against each other and looking at the camera with a smile. He is wearing a white dress shirt and a dark blazer. Photo by Erkki Laine."
  - article:
    - heading "Why am I running for parliament?" [level=2]
    - paragraph: Politics is at its best when we look after our shared affairs together. I am running because I want to make sure that Finland thrives in the age of AI on its own terms, and that no one is left behind. What matters most to me is openness and honesty, and the belief that people are fundamentally good – we must be able to discuss shared matters with anyone, even when we disagree.
    - paragraph: Finland has built high technology for decades, from Vaisala to icebreakers, Nokia, Linux, and Supercell. AI challenges us to write a new chapter in this story, and it is changing work, the economy, and public services faster than legislation can keep up. The question is whether that change happens on our terms or someone else’s.
    - paragraph: I have built secure software and banking services for over a decade and studied technology at Aalto University. When decisions are made about code, procurement, or data security, I know what is being discussed – and I want to make sure the solutions serve everyone’s everyday life. I also understand where the limits on technology must be set, so that the rule of law endures.
    - paragraph: Some of these limits are particularly valuable, because they protect everyone’s privacy and fundamental rights. Privacy protection is not a brake on development, but a prerequisite for democracy.
    - paragraph: I am Lauri Lavanti, the Greens’ parliamentary candidate in Uusimaa, a municipal councilor from Kirkkonummi, Chair of the Green Council Group, father of four, lead developer, and Master of Science in Technology. On these pages, you will find my thoughts on the future and what lies ahead for us.
