      - text: .
    - paragraph: JaaSamoin tarkoittaa, että jos muokkaat kuvaa ja julkaiset lopputuloksen, jaat sen samalla CC BY-SA 4.0 -lisenssillä. Muut sivustolla olevat, muiden kuvaajien kuvat eivät kuulu tämän lisenssin piiriin.