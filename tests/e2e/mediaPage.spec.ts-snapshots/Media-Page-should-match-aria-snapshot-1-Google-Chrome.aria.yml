    - heading "Kuvat medialle" [level=2]
    - paragraph: "Tälle sivulle on koottu valokuvaaja Markus Isomerin ottamat kuvat Lauri Lavannista. Media ja muut kiinnostuneet saavat ladata ja käyttää niitä vapaasti. Jokaisesta kuvasta on tarjolla kolme rajausta: neliö, pysty ja vaaka. Kuvat latautuvat täydellä tarkkuudella JPEG-muodossa."
