- main:
  - heading "Ota yhteyttä" [level=1]
  - img "Lauri Lavanti nojaa pylvääseen, taustalla muotokuva, katsoo kameraan, hymyillen. Hänellä on päällään valkoinen kauluspaita sinisillä kukkakuvioilla ja tumma pikkutakki. Kuvan otti Juha Jantunen."
  - article:
    - heading "Ollaan yhteydessä" [level=2]
    - paragraph: Tervetuloa! Kirjoitan ja puhun digitaalisesta itsenäisyydestä, tekoälystä, digitalisaatiosta laajemminkin sekä taloudesta. Olen erityisen kiinnostunut kuulemaan myös muiden ajatuksia ja ideoita näiden teemojen ympärillä.
    - paragraph: Uskon, että parhaat ratkaisut syntyvät yhdessä. Siksi haluan kuulla sinulta, olitpa sitten asiantuntija, toimittaja, yhteistyökumppani tai vain kiinnostunut keskustelemaan. Vastaan kaikkiin viesteihin.
    - paragraph: Lähetä viesti jollekin sosiaalisen median tileistäni tai suoraan sähköpostiini.
    - heading "Uutiskirje" [level=2]
    - paragraph:
      - text: Tilaa
      - link "uutiskirjeeni":
        - /url: /fi/newsletter/
      - text: ja saat ajatuksiani suoraan sähköpostiisi.
    - heading "Mistä minut saa kiinni?" [level=2]
