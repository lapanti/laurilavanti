  - 'img "Lauri Lavanti stands in front of a glass wall, wearing a dark blazer and a patterned shirt. Photo: Markus Isomeri."'
  - heading "Newsletter" [level=1]
  - paragraph: "The newsletter covers one topic at a time: AI, digital independence, privacy, and the societal impacts of technology. The aim is to go through the effects of upcoming changes thoroughly, yet in an accessible way."
  - article:
    - heading "How is AI transforming work and the economy?" [level=2]
    - paragraph
    - paragraph: In my newsletter, I explore how technology – especially artificial intelligence – is transforming our society, work, and daily lives. I address topics such as why digital independence is essential for society, how AI-driven changes in work force us to innovate, and what kind of future we want to build together.
    - paragraph
    - paragraph: I believe that technology should enable new solutions. That’s why I emphasize sustainable innovations and spark conversation about how we can leverage the opportunities technology provides. My goal is to provide thought-provoking, fact-based, and solution-oriented content.
    - heading "Recent topics" [level=2]
    - list:
      - listitem: Age limits on social media — how others have done it, how it should be done, and should it be done at all?
      - listitem: The inevitability of AI — are we active agents or subjects of change.
      - listitem: Data centres in Finland — are they a threat or an opportunity for us.
    - heading "Subscribe to the newsletter" [level=2]
    - paragraph: Subscribe to my newsletter and get analysis on the latest developments in AI and technology, and their impact on society, straight to your inbox.
    - text: Email
    - textbox "Email"
    - paragraph:
      - text: You can unsubscribe at any time. For more information, read our
