- main:
  - heading "Kirjoitukset" [level=1]
  - img "Lauri Lavanti istumassa jakkaralla ja nojaa korkeaan pöytään. Päällään hänellä on musta bleiseri ja sinivalkoinen kukkakuvioinen kauluspaita. Bleiserin taskussa on monivärinen taskuliina. Taustalla portaikko."
  - article:
    - paragraph: Tekoäly muuttaa kaiken — työn, talouden sekä sen, miten valtio ja yhteiskunnat laajemmin toimivat. Tämä muutos tapahtuu kaiken lisäksi ennennäkemättömällä nopeudella. Kirjoitan erityisesti siitä, miten se vaikuttaa talouteen, sivistykseen ja vapauteen. Näiden kolmen on toimittava eduksemme, jotta meille toteutuu digitaalinen itsenäisyys. Jotta Suomi voi olla yhteiskunta, joka käyttää teknologiaa omilla ehdoillaan.
    - heading "Mitä tarkoittaa elää tekoälyn aikakaudella?" [level=2]
    - paragraph: Minulla on kokemusta yli vuosikymmenen ajalta turvallisten ohjelmistojen ja pankkijärjestelmien rakentajana. Sitä taustaa vasten kirjoitan siitä, miksi tekoäly ei muuta pelkästään työtä, vaan pakottaa meidät miettimään uudelleen lähes kaikki yhteiskunnan osa-alueet. Sosiaaliturvan, miksi digitaalinen itsenäisyys on välttämättömyys vapaan yhteiskunnan kannalta, ja miten varmistamme, että teknologiasta hyötyvät kaikki — eivät vain harvat.
    - heading "Tekoäly" [level=2]
    - paragraph: Käytän ja kehitän tekoälytyökaluja työssäni päivittäin. Tekoäly on aikamme merkittävin teknologinen murros, ja Suomen on tartuttava siihen aktiivisesti, jotta saamme siitä hyötyjä emmekä pelkkiä haittoja.
    - paragraph: Tekoäly vahvistaa sekä kykyjä että vahinkoja. Julkisen sektorin sovelluksissa — etuuspäätöksissä, lupien käsittelyssä, ennakoivassa poliisitoiminnassa — panokset ovat liian suuria, jotta järjestelmiä voitaisiin ottaa käyttöön ilman läpinäkyvyyttä ja valvontaa. Haluan tarkistettavissa olevia algoritmeja merkityksellisiin päätöksiin, avoimia tekoälymalleja silloin kun mahdollista, ja pakollista ihmisvalvontaa yksilöiden oikeuksiin vaikuttavissa päätöksissä.
    - paragraph: Mitä voimakkaammaksi tekoäly kehittyy, sitä tärkeämmäksi yksityisyyden suoja tulee. Tekoälyjärjestelmät ovat tiedonnälkäisiä; ilman vahvoja tietosuojasääntöjä niistä tulee valvontainfrastruktuuria. EU:n tekoälysäädös on askel oikeaan suuntaan, mutta toimeenpanon on oltava tosiasiallista — ei pelkkä muodollisuus.
