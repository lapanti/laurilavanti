    - region "Digitaalinen itsenäisyys":
      - heading "Digitaalinen itsenäisyys" [level=2]
      - paragraph: /Suomen ja Euroopan on hallittava omaa digitaalista infrastruktuuriaan\. Siksi perustin Digitaalinen itsenäisyys -kansalaisaloitteen, joka keräsi eduskuntakäsittelyyn vaadittavat \d+ \d+ allekirjoitusta heinäkuussa \d+\. Aloitteessa vaadimme Suomea vähentämään riippuvuuttaan ulkomaisista digipalveluiden tarjoajista ja vahvistamaan digitaalista suvereniteettia\./
      - paragraph: "/Suomen julkishallinto on voimakkaasti riippuvainen esimerkiksi yhdysvaltalaisista suurista pilvipalvelujen tarjoajista, niin kutsutuista hyperscalereistä — Amazonista, Microsoftista ja Googlesta\\. Vuoden \\d+ jälkeen on tullut valitettavan selkeäksi, että valtapeli geopolitiikassa on tullut jäädäkseen, myös digitaaliseen toimintaympäristöön\\. Suomalaisia ja eurooppalaisia vaihtoehtoja on olemassa: UpCloud on konkreettinen esimerkki suorituskykyisestä kotimaisesta pilvipalvelusta, jota julkinen sektori voi käyttää\\. Edistän julkisten IT-hankintojen pilkkomista ja avoimen lähdekoodin suosimista sekä kriisivalmiuden — digitaalisen huoltovarmuuden — huomioimista hankinnoissa\\./"
      - paragraph: Digitaalinen itsenäisyys tarkoittaa myös datan siirrettävyyttä ja riippuvuuden yksittäisistä toimittajista välttämistä. Julkisella rahalla tuotetun julkisen datan tulee olla siirrettävää ja tallennettuna siten, että sitä eivät ulkopuoliset tahot voi väärinkäyttää.
