    - text: Syntes
    - heading "Digital självständighet" [level=2]
    - paragraph: /Finland och Europa måste kontrollera sin egen digitala infrastruktur\. Därför grundade jag medborgarinitiativet Digital självständighet, som samlade in de \d+ \d+ underskrifter som krävs för riksdagsbehandling i juli \d+\. I initiativet kräver vi att Finland minskar sitt beroende av utländska digitala tjänsteleverantörer och stärker den digitala suveräniteten\./
    - paragraph: "/Finlands offentliga förvaltning är kraftigt beroende av till exempel stora amerikanska molntjänstleverantörer, så kallade hyperscalers — Amazon, Microsoft och Google\\. Efter \\d+ har det blivit beklagligt tydligt att geopolitiskt maktspel är här för att stanna, även i den digitala verksamhetsmiljön\\. Finländska och europeiska alternativ finns: UpCloud är ett konkret exempel på en högpresterande inhemsk molntjänst som den offentliga sektorn kan använda\\. Jag driver på för att offentliga IT-upphandlingar delas upp och att öppen källkod gynnas, samt att krisberedskap — digital försörjningsberedskap — beaktas i upphandlingarna\\./"
    - text: Vem
    - heading "Vem är Lauri Lavanti?" [level=2]
    - paragraph: Jag har byggt säkra programvaror och banktjänster i över ett decennium och studerat teknik vid Aalto-universitetet. När det fattas beslut om kod, upphandlingar eller datasäkerhet vet jag vad det handlar om – och jag vill se till att lösningarna tjänar allas vardag. Jag förstår också var teknikens gränser måste sättas, för att rättsstaten ska bestå.
    - 'figure "Foto: Markus Isomeri"':
      - img "Lauri Lavanti jobbar på sin bärbara dator i Amfi-trapporna i Aalto-universitetets huvudbyggnad."
