  - article:
    - text: /Riksdagsvalet \d+/
    - heading "Varför kandiderar jag?" [level=2]
    - paragraph: "I decennier har Finland varit ett föregångsland inom högteknologi och kompetens – från Vaisala till isbrytare, Nokia till Linux, Supercell till ICEYE och IQM. Den positionen vacklar nu. Samtidigt omvälver AI samhället i grunden: det förändrar arbetet, förtroendet för digitala tjänster och hur människor knyter an till varandra. Dessutom sätter statens ekonomiska läge gränser för vad vi kan göra."
    - paragraph: Nu om någonsin behövs kompetens och förståelse för teknik, AI och hur de påverkar samhället och marknaderna. Jag har en teknisk utbildning från Aalto-universitetet och över ett decenniums praktisk erfarenhet av att bygga säkra programvaror och banktjänster. Jag förstår på vilka olika sätt tekniken kan användas och hur den påverkar samhället. Jag förstår också var dess gränser måste sättas, för att vi ska bevara rättsstaten.
    - paragraph: "En del av dessa gränser är särskilt värdefulla: de skyddar allas vår integritet och grundläggande rättigheter. Integritetsskydd är ingen broms för utvecklingen, utan en förutsättning för demokratin."
    - paragraph: Jag är Lauri Lavanti, kommunfullmäktigeledamot i Kyrkslätt, ordförande för De grönas fullmäktigegrupp, far till fyra barn, ledande programutvecklare och diplomingenjör. På dessa sidor hittar du mina tankar om framtiden och vad som väntar oss.
    - text: Pelare ett
    - heading "Ekonomin ska fungera" [level=2]
    - paragraph: Finlands ekonomi måste fungera i AI-tidsåldern. Det betyder nya företag, nya arbetstillfällen och offentliga tjänster som verkligen använder teknik i stället för att bara köpa in den utifrån. Utan teknikkompetens i riksdagen fattas besluten om AI-upphandlingar, datainfrastruktur och arbetsliv av människor som inte vet vad de köper.
    - list:
      - listitem: Konkurrenskraft
      - listitem: Upphandling
      - listitem: Överförbarhet
      - listitem: Öppen källkod
    - paragraph: "Jag skriver om ekonomin utifrån det jag har gjort i över ett decennium: byggt programvara och programvaruteam inom olika branscher. AI förändrar grunderna för arbete, konkurrenskraft och offentliga tjänster. Finland kan vara en föregångare här, men bara om de offentliga satsningarna riktas mot inhemsk kompetens, på ett sätt som bygger på att man förstår vad man gör."
    - list:
      - listitem:
        - link "Finland kan göra elektrifieringen till en konkurrensfördel":
          - /url: /sv/blog/65/finland-kan-gora-elektrifieringen-till-en-konkurrensfordel/
      - listitem:
        - link "De gröna – Marknadsekonomiets sanna försvarare":
          - /url: /sv/blog/62/de-grona-marknadsekonomiets-sanna-forsvarare/
    - text: Pelare två
    - heading "Bildningen ska vara sömlös" [level=2]
    - paragraph: Finlands styrka har alltid varit dess människor och deras kunnande. I AI-tidsåldern måste bildningen förbli sömlös — från småbarnspedagogik till arbetsliv och ända fram till pensionen — så att var och en kan utveckla sin fulla potential. Då förstärks AI:s produktivitetsvinster för hela samhället, och ingen lämnas efter.
    - list:
      - listitem: Kunnande
      - listitem: Jämlikhet
      - listitem: Bibliotek
      - listitem: Livslångt lärande
    - paragraph: Utbildning är ingen utgiftspost som skärs ner först när budgeten stramas åt. Den är central infrastruktur för hela den AI-tid som väntar. Besparingar på undervisning, bibliotek, yrkesutbildning och studier betalas tillbaka tiofalt när arbetsmarknaden förändras snabbare än människor hinner lära sig nya saker.
    - list:
      - listitem:
        - link "AI hjälper trygga kommunala tjänster, men det är inte gratis":
          - /url: /sv/blog/60/ai-hjalper-till-att-sakra-kommunala-tjanster-men-det-kostar/
      - listitem:
        - link "Utbildning är kommunens viktigaste uppgift":
          - /url: /sv/blog/37/utbildning-ar-kommunens-viktigaste-uppgift/
    - text: Pelare tre
    - heading "Friheten ska vara trygg" [level=2]
    - paragraph: Frihet är en av de viktigaste frågorna i AI-tidsåldern. Det handlar om huruvida din data, din kommunikation och din vardag förblir dina egna, när merparten av infrastrukturen de finns på ägs av någon annan. Integritetsskydd är en grundläggande rättighet — men den större frågan är om de grundläggande rättigheterna består samtidigt som vi utvecklar teknik som gör massövervakning nästan gratis.
    - list:
      - listitem: Integritet
      - listitem: Grundläggande rättigheter
      - listitem: Rättsstat
      - listitem: Massövervakning
    - paragraph: "Under min karriär har jag byggt programvara i miljöer där dataregler tas på allvar — reglerade branscher som finansbranschen — samt i miljöer där data är affärsverksamheten. Den erfarenheten har gjort en sak tydlig: integritet och grundläggande rättigheter skyddar inte sig själva. De skyddas av lagar, regler och individer som brinner för frågan."
    - list:
      - listitem:
        - 'link "Chat control: parlamentet handlade rätt"':
          - /url: /sv/blog/54/chat-control-parlamentet-handlade-ratt/
      - listitem:
