- main:
  - heading "Lauri Lavanti" [level=1]
  - heading "Eftersom tekniken ska tjäna Finland" [level=2]
  - paragraph: Kandiderar till riksdagen i Nyland
  - img "Lauri Lavanti lutar sig mot händerna och tittar in i kameran med ett leende. Han bär en vit skjorta och en mörk kavaj. Foto av Erkki Laine."
  - article:
    - heading "Varför kandiderar jag till riksdagen?" [level=2]
    - paragraph: Politik är som bäst att vi tar hand om gemensamma angelägenheter tillsammans. Jag kandiderar för att jag vill säkerställa att Finland klarar sig i AI-tidsåldern på egna villkor, och att ingen lämnas efter i utvecklingen. Det viktigaste för mig är öppenhet och ärlighet samt tron på att människor i grunden är goda – gemensamma angelägenheter måste kunna diskuteras med vem som helst, även om vi är av olika åsikt.
    - paragraph: Finland har byggt högteknologi i decennier, från Vaisala till isbrytare, Nokia, Linux och Supercell. AI utmanar oss att skriva ett nytt kapitel i denna berättelse, och den förändrar arbete, ekonomi och offentliga tjänster snabbare än lagstiftningen hinner med. Frågan är om förändringen sker på våra villkor eller på någon annans.
    - paragraph: Jag har byggt säkra programvaror och banktjänster i över ett decennium och studerat teknik vid Aalto-universitetet. När det fattas beslut om kod, upphandlingar eller datasäkerhet vet jag vad det handlar om – och jag vill se till att lösningarna tjänar allas vardag. Jag förstår också var teknikens gränser måste sättas, för att rättsstaten ska bestå.
    - paragraph: En del av dessa gränser är särskilt värdefulla, eftersom de skyddar allas integritet och grundläggande rättigheter. Integritetsskyddet är ingen broms för utvecklingen, utan en förutsättning för demokratin.
    - paragraph: Jag är Lauri Lavanti, De Grönas riksdagskandidat i Nyland, kommunalråd i Kyrkslätt, ordförande för Grönas fullmäktigegrupp, far till fyra barn, ledande programutvecklare och civilingenjör. På dessa sidor hittar du mina tankar om framtiden och vad som väntar oss.
    - heading "Prenumerera på nyhetsbrevet" [level=2]
    - paragraph: Prenumerera på mitt nyhetsbrev och få analyser av den senaste utvecklingen inom AI och teknik, samt dess påverkan på samhället, direkt till din inkorg.
