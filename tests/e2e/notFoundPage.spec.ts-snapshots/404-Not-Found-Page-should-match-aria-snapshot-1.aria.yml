      - listitem:
        - 'article "Digitaalinen itsenäisyys: 5 + 1 valintaa arkeen"':
          - 'link "Piirretty kuva, jossa vaaleahiuksinen nainen pitää käsissään kannettavaa tietokonetta. Tietokoneen ruudussa on Suomen lippu. Tietokonetta yrittää riistää naiselta valkopäämerikotka. Kuvan ympärillä lukee \"Digital independence\", \"Digitaalinen itsenäisyys\" ja \"Digital självständighet\". Tekijänoikeudet kuvaan ovat Digitaalinen itsenäisyys -kansalaisaloitteella. Digitaalinen itsenäisyys: 5 + 1 valintaa arkeen"':
            - /url: /fi/blog/66/digitaalinen-itsenaisyys-arjen-valinnat/
            - img "Piirretty kuva, jossa vaaleahiuksinen nainen pitää käsissään kannettavaa tietokonetta. Tietokoneen ruudussa on Suomen lippu. Tietokonetta yrittää riistää naiselta valkopäämerikotka. Kuvan ympärillä lukee \"Digital independence\", \"Digitaalinen itsenäisyys\" ja \"Digital självständighet\". Tekijänoikeudet kuvaan ovat Digitaalinen itsenäisyys -kansalaisaloitteella."
            - 'heading "Digitaalinen itsenäisyys: 5 + 1 valintaa arkeen" [level=2]'
          - 'complementary "Kirjoituksen \"Digitaalinen itsenäisyys: 5 + 1 valintaa arkeen\" meta-tiedot"':
            - time: /\d+\.\d+\.\d+/
            - list:
              - listitem:
                - link "Digitaalinen itsenäisyys":
                  - /url: /fi/category/digital-independence/
              - listitem:
                - link "Digitalisaatio":
                  - /url: /fi/category/digitalisation/
          - paragraph: Digitaalinen itsenäisyys rakentuu arjen valinnoissa. Tässä on 5 + 1 konkreettista keinoa, joilla vahvistat sitä ja digitaalista huoltovarmuutta itse.
      - listitem:
