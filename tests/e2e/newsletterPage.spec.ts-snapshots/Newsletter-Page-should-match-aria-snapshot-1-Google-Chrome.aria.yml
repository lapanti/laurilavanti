  - heading "Uutiskirje" [level=1]
  - paragraph: "Uutiskirje käsittelee yhtä aihetta kerrallaan: tekoälyä, digitaalista itsenäisyyttä, yksityisyyden suojaa ja teknologian yhteiskunnallisia vaikutuksia. Tarkoitus on käydä tulevien muutoksien vaikutuksia läpi syvällisesti, mutta ymmärrettävästi."
  - article:
    - heading "Miten tekoäly muuttaa työtä ja taloutta?" [level=2]
    - paragraph
    - paragraph: Uutiskirjeessäni pohdin, miten teknologia, erityisesti tekoäly, muuttaa yhteiskuntaamme, työtämme ja arkeamme. Käsittelen esimerkiksi sitä, miksi digitaalinen itsenäisyys on välttämättömyys yhteiskunnalle, miten tekoälyn aiheuttama työn muutos pakottaa meidät uudistumaan ja millaista tulevaisuutta haluamme rakentaa yhdessä.
    - paragraph
    - paragraph: Uskon, että teknologian tulee mahdollistaa uusia ratkaisuja. Siksi korostan kestäviä innovaatioita ja herätän keskustelua siitä, miten voimme hyödyntää teknologian tarjoamia mahdollisuuksia. Tavoitteenani on tarjota ajatuksia herättävää, faktoihin perustuvaa ja ratkaisulähtöistä sisältöä.
    - heading "Viimeaikaisia aiheita" [level=2]
    - list:
      - listitem: Ikärajat someen — miten muualla on tehty, miten pitäisi tehdä, ja pitäisikö ollenkaan?
      - listitem: Tekoälyn väistämättömyys — olemmeko aktiivisia toimijoita vai muutosten kohde.
      - listitem: Datakeskukset Suomessa — ovatko ne meille uhka vai mahdollisuus.
    - heading "Tilaa uutiskirje" [level=2]
    - paragraph: Tilaamalla uutiskirjeeni saat sähköpostiisi analyysejä tuoreimmista kehityskuluista tekoälyn ja teknologian saralla sekä arvioita niiden vaikutuksista yhteiskuntaan.
