name: Setup project
description: Install the exact Node.js, npm, and project dependency versions

inputs:
    playwright:
        description: Install and cache Playwright browsers and system dependencies
        default: 'false'
        required: false

runs:
    using: composite
    steps:
        - name: Setup Node.js
          uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
          with:
              node-version-file: .nvmrc
              cache: npm
              cache-dependency-path: package-lock.json

        - name: Install exact npm
          shell: bash
          run: |
              package_manager=$(node scripts/lib/read-json-field.mjs package.json packageManager)
              npm_version=${package_manager#npm@}
              npm install --global "npm@$npm_version"
              test "$(npm --version)" = "$npm_version"

        - name: Install dependencies
          shell: bash
          run: npm ci

        - name: Cache Playwright browsers
          if: inputs.playwright == 'true'
          uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
          with:
              path: ~/.cache/ms-playwright
              key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

        - name: Install Playwright browsers and dependencies
          if: inputs.playwright == 'true'
          shell: bash
          run: npm run test:e2e:setup
