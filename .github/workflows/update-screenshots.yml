name: Update baselines

# Regenerates every screenshot AND aria-snapshot golden in the exact environment
# the CI gate uses (same runner image, same deploy pipeline) and hands the result
# back as a run artifact. Goldens are CI-canonical (issue #1393): local
# `--update-snapshots` runs are for iteration only and may sit a pixel off CI —
# and aria trees can differ outright (below-fold nodes the deployed render
# includes but a fast local preview races past).
#
# The artifact is committed locally so the commit carries the author's GPG
# signature (branch protection requires signed commits — CI holds no key):
#
#   gh run download <run-id> --name ci-screenshot-baselines --dir tests/e2e
#   git add tests/e2e/*-snapshots && git commit && git push

on:
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    # Baselines are reviewed through a PR like any other change — never
    # regenerated from main.
    if: github.ref != 'refs/heads/main'
    name: Regenerate snapshot baselines
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
          cache-dependency-path: "package-lock.json"
      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - id: deploy
        name: Deploy preview
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          # Same race-free deploy shape as main.yml (issue #1391): explicit
          # branch, and the tests below target the unique deployment-url.
          command: pages deploy dist --project-name=laurilavanti --branch=${{ github.ref_name }}

      - uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npm run test:e2e:setup

      - name: Regenerate snapshot baselines
        env:
          E2E_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: npm run test:e2e:update
        timeout-minutes: 30

      - name: Report whether baselines changed
        id: changed
        run: |
          if git diff --quiet -- tests; then
            echo "Baselines already match CI rendering."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git diff --stat -- tests
            echo "changed=true" >> "$GITHUB_OUTPUT"
            {
              echo "### Baselines changed"
              echo ""
              echo "Download and commit with your signature:"
              echo ""
              echo '```'
              echo "gh run download ${{ github.run_id }} --name ci-screenshot-baselines --dir tests/e2e"
              echo "git add tests/e2e/*-snapshots && git commit && git push"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload regenerated baselines
        if: steps.changed.outputs.changed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ci-screenshot-baselines
          path: tests/e2e/*-snapshots
          retention-days: 7
