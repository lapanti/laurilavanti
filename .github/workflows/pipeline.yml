name: pipeline

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

permissions:
    contents: read

concurrency:
    group: pipeline-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    build:
        name: Build
        runs-on: ubuntu-latest
        outputs:
            artifact-sha256: ${{ steps.checksum.outputs.sha256 }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            - uses: ./.github/actions/setup-project
            - name: Cache Astro build data
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
              with:
                  path: .astro
                  key: astro-${{ runner.os }}-${{ hashFiles('astro.config.*', 'src/**', 'public/**') }}
                  restore-keys: astro-${{ runner.os }}-
            - name: Build static artifact
              run: npm run build
            - name: Create artifact manifest
              id: checksum
              run: |
                  find dist -type f -print0 | sort -z | xargs -0 sha256sum > candidate.sha256
                  sha256sum --check candidate.sha256
                  echo "sha256=$(sha256sum candidate.sha256 | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
            - name: Upload candidate artifact
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
              with:
                  name: candidate-site
                  path: |
                      dist/
                      candidate.sha256
                  if-no-files-found: error
                  retention-days: 7

    lint:
        name: Lint
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            - uses: ./.github/actions/setup-project
            - run: npm run lint

    typecheck:
        name: Check
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            - uses: ./.github/actions/setup-project
            - run: npm run check

    knip:
        name: Knip
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            - uses: ./.github/actions/setup-project
            - run: npm run knip

    check-overflow:
        name: Overflow check
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            - uses: ./.github/actions/setup-project
            - name: Check titles for horizontal overflow
              run: npm run validate-page-titles

    validate-content:
        name: Validate content
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            - uses: ./.github/actions/setup-project
            - name: Run SEO checks on all MDX files
              run: |
                  find src/pages src/content/posts -name '*.mdx' | while read -r file; do
                    bash scripts/checks/seo.sh "$file"
                  done
            - name: Run AEO checks on all MDX files
              run: |
                  find src/pages src/content/posts -name '*.mdx' | while read -r file; do
                    bash scripts/checks/aeo.sh "$file"
                  done
            - name: Run content checks on all MDX files
              run: |
                  find src/pages src/content/posts -name '*.mdx' | while read -r file; do
                    bash scripts/checks/content.sh "$file"
                  done
            - name: Run Finnish style checks
              run: |
                  { find src/pages/fi -name '*.mdx'; find src/content/posts -name 'fi.mdx'; } | while read -r file; do
                    bash scripts/checks/style-fi.sh "$file"
                  done
            - name: Run passage length and freshness checks
              run: find src/pages src/content/posts -name '*.mdx' -print0 | xargs -0 node --experimental-strip-types scripts/checks/mdx-deep.ts
            - name: Run cross-file checks
              run: node scripts/checks/cross-file.mjs
            - name: Run redirect source audit
              run: npm run audit:redirects

    unit-test:
        name: Unit tests
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            - uses: ./.github/actions/setup-project
            - name: Run unit tests
              run: npm run test:coverage
            - name: Upload coverage
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
              with:
                  name: coverage-folder
                  path: coverage/
                  if-no-files-found: error
                  retention-days: 7

    sonarcloud:
        name: SonarCloud analysis
        needs: [unit-test]
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  fetch-depth: 0
            - uses: ./.github/actions/setup-project
            - name: Download coverage
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
              with:
                  name: coverage-folder
                  path: coverage
            - name: Scan with SonarCloud
              uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    candidate-preview:
        name: Candidate preview
        needs: [build]
        runs-on: ubuntu-latest
        outputs:
            url: ${{ steps.candidate.outputs.url }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            - uses: ./.github/actions/setup-project
            - name: Download candidate artifact
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
              with:
                  name: candidate-site
                  path: .
            - name: Verify candidate artifact
              env:
                  EXPECTED_SHA256: ${{ needs.build.outputs.artifact-sha256 }}
              run: |
                  sha256sum --check candidate.sha256
                  test "$(sha256sum candidate.sha256 | cut -d ' ' -f 1)" = "$EXPECTED_SHA256"
            - name: Deploy unique Cloudflare candidate
              id: deploy
              uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4
              with:
                  apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                  wranglerVersion: '4.125.0'
                  command: pages deploy dist --project-name=laurilavanti --branch=candidate-${{ github.run_id }}-${{ github.run_attempt }}
            - name: Verify candidate is reachable
              id: candidate
              env:
                  DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
              run: |
                  candidate_url="${DEPLOYMENT_URL%/}/"
                  case "$candidate_url" in
                    https://*) ;;
                    *) echo "Invalid candidate URL: $candidate_url" >&2; exit 1 ;;
                  esac
                  curl --fail --silent --show-error --retry 10 --retry-all-errors "${candidate_url}fi/" >/dev/null
                  echo "url=$candidate_url" >> "$GITHUB_OUTPUT"

    e2e:
        name: E2E ${{ matrix.suite }}
        needs: [candidate-preview]
        runs-on: ubuntu-latest
        timeout-minutes: 20
        strategy:
            fail-fast: false
            matrix:
                include:
                    - suite: snapshots
                      command: npm run test:e2e:snapshots
                      report: playwright-report-snapshots
                    - suite: screenshots
                      command: npm run test:e2e:screenshots
                      report: playwright-report-screenshots
                    - suite: axe
                      command: npm run test:e2e:axe
                      report: playwright-report-axe
                    - suite: siteimprove
                      command: npm run test:e2e:siteimprove
                      report: playwright-report-siteimprove
                    - suite: horizontal scroll
                      command: npm run test:e2e:horizontal-scroll
                      report: playwright-report-horizontal-scroll
                    - suite: other
                      command: npm run test:e2e:other
                      report: playwright-report-other
        env:
            E2E_URL: ${{ needs.candidate-preview.outputs.url }}
            PLAYWRIGHT_HTML_REPORT: ${{ matrix.report }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            - uses: ./.github/actions/setup-project
              with:
                  playwright: 'true'
            - name: Run ${{ matrix.suite }} tests
              run: ${{ matrix.command }}
            - name: Upload Playwright report
              if: always()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
              with:
                  name: ${{ matrix.report }}
                  path: ${{ matrix.report }}/
                  if-no-files-found: ignore
                  retention-days: 30

    lighthouse:
        name: Lighthouse
        needs: [candidate-preview]
        runs-on: ubuntu-latest
        permissions:
            contents: read
            pull-requests: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            - uses: ./.github/actions/setup-project
            - name: Audit candidate performance
              uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12
              with:
                  urls: |
                      ${{ needs.candidate-preview.outputs.url }}fi/
                      ${{ needs.candidate-preview.outputs.url }}fi/about/
                      ${{ needs.candidate-preview.outputs.url }}fi/blog/1/kotihoidon-tuen-kuntalisa/
                  budgetPath: .github/lighthouse-budget.json
                  uploadArtifacts: true
                  temporaryPublicStorage: true
                  githubToken: ${{ secrets.GITHUB_TOKEN }}

    required-checks:
        name: Required checks
        if: always()
        needs:
            - build
            - lint
            - typecheck
            - knip
            - check-overflow
            - validate-content
            - unit-test
            - sonarcloud
            - candidate-preview
            - e2e
            - lighthouse
        runs-on: ubuntu-latest
        steps:
            - name: Require every dependency to succeed
              env:
                  RESULTS: ${{ join(needs.*.result, ' ') }}
              run: |
                  for result in $RESULTS; do
                    if [ "$result" != 'success' ]; then
                      echo "Required dependency result: $result" >&2
                      exit 1
                    fi
                  done

    production:
        name: Production deployment
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        needs: [build, required-checks]
        runs-on: ubuntu-latest
        concurrency:
            group: production-${{ github.repository }}
            cancel-in-progress: false
        permissions:
            contents: read
            deployments: write
        outputs:
            url: ${{ steps.deploy.outputs.deployment-url }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            - uses: ./.github/actions/setup-project
            - name: Download tested candidate artifact
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
              with:
                  name: candidate-site
                  path: .
            - name: Verify tested artifact checksum
              env:
                  EXPECTED_SHA256: ${{ needs.build.outputs.artifact-sha256 }}
              run: |
                  sha256sum --check candidate.sha256
                  test "$(sha256sum candidate.sha256 | cut -d ' ' -f 1)" = "$EXPECTED_SHA256"
            - name: Deploy tested artifact to production
              id: deploy
              uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4
              with:
                  apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                  gitHubToken: ${{ secrets.GITHUB_TOKEN }}
                  wranglerVersion: '4.125.0'
                  command: pages deploy dist --project-name=laurilavanti --branch=main

    production-smoke:
        name: Production smoke
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        needs: [production]
        runs-on: ubuntu-latest
        timeout-minutes: 10
        env:
            E2E_URL: '${{ needs.production.outputs.url }}'
            PLAYWRIGHT_HTML_REPORT: playwright-report-production-smoke
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            - uses: ./.github/actions/setup-project
              with:
                  playwright: 'true'
            - name: Verify production routes
              run: npx playwright test tests/e2e/localeLessRedirects.spec.ts tests/e2e/rootLanguageRedirect.spec.ts
            - name: Upload production smoke report
              if: always()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
              with:
                  name: playwright-report-production-smoke
                  path: playwright-report-production-smoke/
                  if-no-files-found: ignore
                  retention-days: 30
